name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm validate:content
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke
      - run: sudo apt-get update && sudo apt-get install -y android-sdk android-sdk-platform-23 dalvik-exchange zip
      - run: node tools/android/build-apk.mjs --skip-web && node tools/android/verify-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
